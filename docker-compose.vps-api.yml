# VPS production API only — use explicit -f; no mongo/worker, no local override.
# Scheduler remains on existing PM2 process until separately migrated.
#
#   docker compose -f docker-compose.vps-api.yml up -d --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: care-circle-reminder-docker-api
    restart: unless-stopped
    ports:
      - '127.0.0.1:${API_DOCKER_HOST_PORT:-3113}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PROCESS_MODE: api
      PORT: '3000'
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_HOST_PATH:-./secrets/firebase-service-account.json}:/run/secrets/firebase-service-account.json:ro
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/health/ready']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
