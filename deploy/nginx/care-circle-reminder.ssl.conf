# Production TLS for Care Circle API.
# App bind: 127.0.0.1:1001 (Docker 1001 -> container 3000).
# Nginx site name: care-circle-reminder
# Public traffic: 80/443 only.

upstream care_circle_reminder_api {
    server 127.0.0.1:1001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name carecircle.smartremindersapp.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name carecircle.smartremindersapp.com;

    ssl_certificate     /etc/letsencrypt/live/carecircle.smartremindersapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carecircle.smartremindersapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;

    location /health/live {
        proxy_pass http://care_circle_reminder_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass http://care_circle_reminder_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
