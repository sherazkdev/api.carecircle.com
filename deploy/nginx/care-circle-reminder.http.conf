# HTTP bootstrap for Let's Encrypt.
# After certbot, replace with care-circle-reminder.ssl.conf.
# Site file on VPS: /etc/nginx/sites-available/care-circle-reminder

upstream care_circle_reminder_api {
    server 127.0.0.1:1001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name carecircle.smartremindersapp.com;

    client_max_body_size 1m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://care_circle_reminder_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
